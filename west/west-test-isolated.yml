# test env manifest to setup dependencies under <west topdir>/dependencies
# should be initialized with west init -l west --mf west-test-isolated.yml
manifest:
  self:
    path: west
    import:
      - file: west-dependency/west-test-dependency.yml
        path-prefix: dependencies
      - file: west-dependency/west-dependency.yml
        path-prefix: dependencies
  # Please edit west/west-dependency/ to change dependencies
