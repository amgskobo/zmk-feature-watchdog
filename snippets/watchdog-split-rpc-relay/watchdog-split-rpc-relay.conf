# Base split-relay config: peripheral role by default (CONFIG_ZMK_SPLIT_ROLE_CENTRAL
# unset). Combine with the watchdog-split-central snippet for a central-role build.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN stays at its framework default (128):
# a ListIncidents page is streamed one incident per relay event, so the
# largest message fits (see the BUILD_ASSERTs in src/split/watchdog_relay_events.h).

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
