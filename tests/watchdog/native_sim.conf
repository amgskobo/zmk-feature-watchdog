CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_SETTINGS=y

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_TEST=y
CONFIG_ZMK_WATCHDOG_MAX_INCIDENTS=8

# Detectors (SS4). The owner matches Task WDT's background interval to its
# software deadline. Freeze timeout is kept small here so the
# freeze-detector unit test (which sleeps past it) stays fast.
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=y
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=200
CONFIG_ZMK_WATCHDOG_FATAL_DETECT=y
CONFIG_ZMK_WATCHDOG_TEST_INJECTION=y

# The RPC surface (SS8) is tested in tests/studio/ instead of here: enabling
# CONFIG_ZMK_STUDIO requires a physical-layout devicetree (see
# zmk/app/src/physical_layouts.c's BUILD_ASSERT), which this test's keymap
# does not provide -- tests/studio/native_sim.keymap uses ../test.dtsi,
# which does.

# Explicit owner input fixture; unchanged upstream core remains selected.
CONFIG_ZMK_WATCHDOG_NATIVE_INPUT_FIXTURE=y
CONFIG_ZMK_WATCHDOG_NATIVE_SANITIZER_FIXTURE=y
CONFIG_ASAN=y
CONFIG_ASAN_RECOVER=n
